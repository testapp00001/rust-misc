global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "flash-sale-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "flash-sale-api:3000"
        labels:
          service: "flash-sale-api"
          environment: "production"

  - job_name: "order-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "order-worker:9090"
        labels:
          service: "order-worker"
          environment: "production"

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis:6379"
        labels:
          service: "redis"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres:5432"
        labels:
          service: "postgres"
