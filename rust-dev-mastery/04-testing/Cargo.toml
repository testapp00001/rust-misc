[package]
name = "testing_mastery"
version = "0.1.0"
edition = "2021"
description = "Module 4: Testing Mastery — unit tests, integration tests, property-based testing, mocking, benchmarks, snapshots"

[dependencies]
proptest = "1"
mockall = "0.13"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "example_benchmarks"
harness = false
