[package]
name = "logging_tracing"
version = "0.1.0"
edition = "2021"
description = "Module 3: Logging & Tracing — structured logging, spans, events, subscriber configuration, distributed tracing"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
