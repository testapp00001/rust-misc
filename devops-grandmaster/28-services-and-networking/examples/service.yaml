apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  labels:
    app: my-app
spec:
  # Service types:
  # ClusterIP (default) — internal only
  # NodePort — exposed on node's IP
  # LoadBalancer — cloud load balancer
  type: ClusterIP
  selector:
    app: my-app
  ports:
    - protocol: TCP
      port: 80          # Service port
      targetPort: 8080   # Container port
