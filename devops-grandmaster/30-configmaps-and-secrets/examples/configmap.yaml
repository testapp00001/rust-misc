apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Simple key-value pairs
  APP_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "8080"

  # Configuration files
  config.json: |
    {
      "database": {
        "host": "db.example.com",
        "port": 5432,
        "name": "myapp"
      },
      "cache": {
        "host": "redis.example.com",
        "port": 6379,
        "ttl": 3600
      }
    }

  nginx.conf: |
    server {
      listen 80;
      server_name localhost;

      location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
    }
