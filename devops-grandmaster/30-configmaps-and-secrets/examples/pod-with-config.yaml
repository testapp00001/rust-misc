apiVersion: v1
kind: Pod
metadata:
  name: app-with-config
spec:
  containers:
    - name: my-app
      image: my-app:1.0
      env:
        # From ConfigMap (individual keys)
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        # From Secret (individual keys)
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DATABASE_PASSWORD
      envFrom:
        # All keys from ConfigMap as env vars
        - configMapRef:
            name: app-config
      volumeMounts:
        # Mount ConfigMap as files
        - name: config-volume
          mountPath: /etc/config
        # Mount Secret as files
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: app-config
    - name: secret-volume
      secret:
        secretName: app-secrets
