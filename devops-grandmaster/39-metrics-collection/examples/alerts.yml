groups:
  - name: container-alerts
    rules:
      # Container CPU usage > 80%
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} CPU usage is above 80%"

      # Container memory usage > 90%
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} memory usage is above 90%"

      # Container restarting frequently
      - alert: ContainerRestarting
        expr: rate(container_restart_count[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container restarting on {{ $labels.instance }}"
          description: "Container {{ $labels.name }} has restarted in the last 15 minutes"

  - name: application-alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% ({{ $value | humanizePercentage }})"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is above 1 second"
