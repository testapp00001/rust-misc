# Rate Limiting Configuration for Nginx

# Define rate limit zones
# Zone: name, memory size, rate per second
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name example.com;

    # General rate limiting
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;
        proxy_pass http://backend;
    }

    # Strict rate limiting for API
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 5;
        proxy_pass http://backend;
    }

    # Very strict rate limiting for login
    location /api/login {
        limit_req zone=login burst=5 nodelay;
        limit_conn addr 3;
        proxy_pass http://backend;
    }

    # Custom error pages for rate limiting
    error_page 429 /429.html;
    location = /429.html {
        internal;
        return 429 "Rate limit exceeded. Please try again later.\n";
    }

    # Block bad user agents
    if ($http_user_agent ~* (bot|crawl|spider|scan)) {
        return 403;
    }

    # Block suspicious requests
    if ($request_uri ~* (\.\.|\.git|\.env|wp-admin|phpMyAdmin)) {
        return 403;
    }
}
